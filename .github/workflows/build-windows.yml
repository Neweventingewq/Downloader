name: Build · Windows .exe

on:
  push:
    branches: [main]
  # Run on every PR regardless of target branch so stacked PRs
  # (branch -> branch -> main) still get CI feedback before the
  # first branch lands.
  pull_request: {}
  workflow_dispatch: {}

jobs:
  windows-exe:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We must switch the Windows compiler from MinGW to MSVC for
      # this branch: Qt does NOT ship pre-built QtWebEngine binaries
      # for MinGW on Windows.  WebEngine is only available with the
      # win64_msvc2022_64 distribution.  install-qt-action handles
      # the 6.8+ "qtwebengine moved to extensions" repo layout via
      # aqtinstall >= 3.2.
      - name: Install Qt 6.8 (MSVC 2022 64-bit) + QtWebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Setup MSVC dev environment (cl, link, nmake, ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Put Qt on PATH
        shell: pwsh
        run: |
          "$Env:QT_ROOT_DIR\bin" | Out-File -FilePath $Env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure (Ninja + MSVC cl)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Volchay-Downloader.exe dist/Volchay-Downloader.exe
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/LICENSE.txt }
          # README is shipped next to the .exe so the artifact is self-contained.
          if (Test-Path README.md) { Copy-Item README.md dist/README.md }

      - name: Run windeployqt
        shell: pwsh
        run: |
          $qml = (Resolve-Path "qml").Path
          # --verbose 2 dumps the full deploy plan into the CI log so we
          # can see which platform plugin, QML modules and styles ended
          # up next to the .exe.  --webenginecore makes windeployqt drop
          # in the QtWebEngineProcess.exe + locales/resources Chromium
          # requires at runtime (without this the WebView won't render).
          # --compiler-runtime brings the MSVC redistributable next to
          # the .exe so users without VS installed can still launch.
          windeployqt `
            --release `
            --verbose 2 `
            --no-translations `
            --compiler-runtime `
            --webenginecore `
            --qmldir "$qml" `
            dist/Volchay-Downloader.exe

      - name: Show deployed QML / plugins (sanity)
        shell: pwsh
        run: |
          Write-Host '--- Platform plugins ---'
          Get-ChildItem dist/platforms -ErrorAction SilentlyContinue
          Write-Host '--- QtQuick / Controls QML modules ---'
          Get-ChildItem dist -Recurse -Filter qmldir | Select-Object FullName
          Write-Host '--- WebEngine artifacts ---'
          Get-ChildItem dist -Recurse -Filter 'QtWebEngineProcess.exe' | Select-Object FullName
          Get-ChildItem dist -Recurse -Filter 'icudtl.dat' | Select-Object FullName

      - name: Download yt-dlp.exe
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' `
            -OutFile dist/yt-dlp.exe
          Get-Item dist/yt-dlp.exe

      - name: Download ffmpeg.exe (essentials build)
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter ffmpeg.exe   | Select-Object -First 1
          $ffp = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter ffprobe.exe  | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName dist/ffmpeg.exe }
          if ($ffp) { Copy-Item $ffp.FullName dist/ffprobe.exe }
          Remove-Item -Recurse -Force ffmpeg_tmp, ffmpeg.zip

      - name: Inspect dist
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Pack zip
        shell: pwsh
        run: |
          $tag = (Get-Date -Format 'yyyyMMdd-HHmmss')
          Compress-Archive -Path dist/* -DestinationPath ("Volchay-Downloader-windows-x64-{0}.zip" -f $tag)
          Get-ChildItem *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Volchay-Downloader-windows-x64
          path: Volchay-Downloader-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 30
